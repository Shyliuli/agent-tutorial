name: 构建并发布教程站点

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装 MkDocs 与 Material 主题
        run: pip install mkdocs-material

      - name: 构建静态站点
        run: mkdocs build --strict

      - name: 上传可下载的站点产物
        uses: actions/upload-artifact@v4
        with:
          name: agent-tutorial-site
          path: site
          retention-days: 30

      - name: 打包站点压缩包
        run: |
          cd site
          zip -r ../agent-tutorial-site.zip .
          cd ..
          ls -la agent-tutorial-site.zip

      - name: 更新“最新构建”发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create latest \
                 --repo "$GITHUB_REPOSITORY" \
                 --title "最新构建产物" \
                 --notes "本页面始终保存教程站点的最新构建产物，下载 agent-tutorial-site.zip 解压后即可直接打开 index.html。"
          gh release upload latest agent-tutorial-site.zip \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
