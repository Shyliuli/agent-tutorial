site_name: Agent 入门与实战
site_description: 面向零基础、非计算机专业同学的智能体（Agent）教学教程
site_author: Agent 教学
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到日间模式

nav:
  - 教程首页: README.md
  - 第 1 章 大语言模型: ch1.md
  - 第 2 章 Agent 的诞生: ch2.md
  - 第 3 章 上下文工程: ch3.md
  - 第 4 章 家规与技能卡: ch4.md
  - 第 5 章 文件格式: ch5.md
  - 第 6 章 版本管理: ch6.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang:
        - zh
        - en

extra:
  generator: false

copyright: Agent 入门与实战 · 从原理到日常工作

# 已停用 Docsify 方案，站点由 MkDocs + Material 预渲染为静态 HTML
